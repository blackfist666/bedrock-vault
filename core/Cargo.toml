[package]
name = "bedrock-vault-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bedrock Vault core: world scanning, level.dat parsing, .mcworld packaging, vault operations"

[dependencies]
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
walkdir.workspace = true
zip.workspace = true

# Process list via the Toolhelp snapshot API. Never shell out to tasklist:
# spawning a console program from a GUI app flashes a window and steals focus.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }
