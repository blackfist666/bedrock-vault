[package]
name = "bedrock-vault-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bedrock Vault desktop app — Tauri 2 shell over bedrock-vault-core"

[[bin]]
name = "bedrock-vault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bedrock-vault-core = { path = "../core" }
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
# File picker for "Import a world…" (.mcworld from Downloads, a Switch export, …)
tauri-plugin-dialog = "2"
