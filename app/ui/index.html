<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bedrock Vault</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wallpaper"></div>

    <header>
      <div class="brand">BEDROCK VAULT</div>
      <div class="header-right">
        <div id="status" class="status"></div>
        <div id="account" class="account hidden">
          <img id="account-pic" class="account-pic" alt="" />
          <div class="account-text">
            <span id="account-name" class="account-name"></span>
            <span id="account-sub" class="account-sub"></span>
          </div>
        </div>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-section="live">
        <span class="tab-icon">🎮</span>
        <span class="tab-text"><span class="tab-name">In Minecraft</span><span class="tab-sub" id="count-live"></span></span>
      </button>
      <button class="tab" data-section="vault">
        <span class="tab-icon">🧰</span>
        <span class="tab-text"><span class="tab-name">Vault</span><span class="tab-sub" id="count-vault"></span></span>
      </button>
      <button class="tab" data-section="backups">
        <span class="tab-icon">🕘</span>
        <span class="tab-text"><span class="tab-name">Backups</span><span class="tab-sub" id="count-backups"></span></span>
      </button>
      <button class="tab" data-section="packs">
        <span class="tab-icon">📦</span>
        <span class="tab-text"><span class="tab-name">Packs</span><span class="tab-sub" id="count-packs"></span></span>
      </button>
      <button class="tab" data-section="realms">
        <span class="tab-icon">🌐</span>
        <span class="tab-text"><span class="tab-name">Realms</span><span class="tab-sub" id="count-realms"></span></span>
      </button>
    </nav>

    <div id="banner" class="banner hidden"></div>

    <div id="progress" class="progress hidden">
      <div class="progress-text"><span id="progress-label"></span><span id="progress-count"></span></div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    </div>

    <section class="bar">
      <p id="explain" class="explain"></p>
      <div class="bar-actions">
        <input id="search" type="search" placeholder="Find a world" />
        <button id="refresh-action" class="mc-btn" style="display: none">Refresh</button>
        <button id="main-action" class="mc-btn green"></button>
      </div>
    </section>

    <main id="grid" class="list"></main>

    <footer>
      <div id="footer"></div>
      <div class="footer-row">
        <span id="vault-path"></span>
        <button id="change-location" class="link">Change folder</button>
        <button id="open-vault" class="link">Open in Explorer</button>
      </div>
    </footer>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h3 id="modal-title"></h3>
        <p id="modal-body"></p>
        <div class="modal-actions">
          <button id="modal-cancel" class="mc-btn">No, go back</button>
          <button id="modal-ok" class="mc-btn"></button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
